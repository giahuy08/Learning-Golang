run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - whitespace
    - gosec
    - prealloc
    - gocritic

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style

issues:
  exclude-rules:
    - path: "_test\\.go$"
      linters:
        - gosec
  max-issues-per-linter: 0
  max-same-issues: 0
